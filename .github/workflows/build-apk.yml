name: Build HT70 Vision Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract and build
        run: |
          unzip -q HT70_Vision_Pro_v0.6_Source.zip
          
          cd HT70_Vision_Pro_v0.6_Source
          echo "android.useAndroidX=true" > 
          gradle.properties
          gradle --no-daemon assembleDebug
  
      - uses: actions/upload-artifact@v4
        with:
          name: HT70-Vision-Pro-debug-APK
          path: HT70_Vision_Pro_v0.6_Source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
